<style>
:root{color-scheme:dark;--ground:#050506;--stage:#0a0a0b;--ink:#f2f2f0;--dim:#8d8d93;--line:#2a2a2e;--track:#26262a}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Rajdhani,"Arial Narrow",sans-serif;overflow:hidden}
.player{width:100%;display:flex;flex-direction:column;gap:10px}
.bar{height:54px}
.frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.frame:fullscreen{border:0;background:#000;display:flex;align-items:center;justify-content:center}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--stage);font-family:Rajdhani,"Arial Narrow",sans-serif;color:var(--ink)}
.stage.paused *{animation-play-state:paused!important}
.hud{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:3px;color:var(--dim);z-index:5}
.bar{display:flex;align-items:center;gap:12px}
.btn{width:44px;height:44px;flex-shrink:0;background:transparent;border:1px solid #3a3a3f;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.seg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.segs{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
.seg{flex-basis:0;height:44px;background:transparent;border:0;padding:0;cursor:pointer;display:flex;align-items:center}
.seg span{display:block;width:100%;height:3px;background:var(--track);overflow:hidden}
.seg span i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.seg.done span i{transform:scaleX(1);background:var(--dim)}
.time{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.cap{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:2px;color:var(--dim);text-align:center}
@media (max-width:520px){.time{display:none}.bar{gap:8px}}
@media (prefers-reduced-motion:reduce){.stage *{animation-duration:1ms!important;animation-delay:0s!important}}
.a{animation-duration:.7s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.up{animation-name:up}.fade{animation-name:fade}.left{animation-name:left}.wipe{animation-name:wipe;animation-duration:.9s}
.pop{animation-name:pop}.grow{animation-name:grow;animation-duration:1.1s}
.logo{animation-name:logo;animation-duration:1.6s}
.flash{animation-name:flash;animation-duration:1s;animation-timing-function:ease-out}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:0;animation:type .9s steps(5) .5s both}
.caret{display:inline-block;width:2px;height:20px;background:#f2f2f0;vertical-align:middle;margin-left:2px;animation:blink 1s steps(1) infinite}
.fillbar{height:100%;background:#f2f2f0;transform-origin:left center;animation-name:fill;animation-timing-function:linear;animation-fill-mode:both}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease-out 1.6s both}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes logo{0%{opacity:0;transform:scale(1.35);letter-spacing:40px;filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;letter-spacing:6px}}
@keyframes flash{0%{opacity:0;transform:scale(1.18)}12%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(.98)}100%{opacity:0;transform:scale(.96)}}
@keyframes type{from{width:0}to{width:5ch}}
@keyframes blink{50%{opacity:0}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}

</style>
</head>

<script>
(function(){
  var durs=[3.6,3.4,6.5,6.5,6.5,6.2,5.5];
  var names=['Intro','Title','Scout','Skills rankings','Tournament','More tools','End card'];
  var total=durs.reduce(function(a,b){return a+b},0);
  var starts=[];durs.reduce(function(a,d,i){starts[i]=a;return a+d},0);
  var stage=document.getElementById('stage'),frame=document.getElementById('frame'),host=document.getElementById('scene');
  var segsEl=document.getElementById('segs'),timeEl=document.getElementById('time'),playBtn=document.getElementById('play');
  var PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>';
  var PAUSE='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15"></rect><rect x="14" y="4.5" width="4" height="15"></rect></svg>';
  var segs=durs.map(function(d,i){
    var b=document.createElement('button');b.type='button';b.className='seg';b.style.flexGrow=d;
    b.setAttribute('aria-label','Jump to '+names[i]);b.innerHTML='<span><i></i></span>';
    b.addEventListener('click',function(){go(i)});segsEl.appendChild(b);return b;
  });
  var scene=0,elapsed=0,playing=true,last=performance.now();
  function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
  function go(i){
    scene=i;elapsed=0;
    host.innerHTML='';host.appendChild(document.getElementById('scene'+i).content.cloneNode(true));
    segs.forEach(function(s,j){s.classList.toggle('done',j<i);s.firstChild.firstChild.style.transform=j<i?'':'scaleX(0)'});
  }
  function tick(now){
    var dt=(now-last)/1000;last=now;
    if(playing){elapsed+=dt;if(elapsed>=durs[scene]){go((scene+1)%durs.length)}}
    segs[scene].firstChild.firstChild.style.transform='scaleX('+Math.min(1,elapsed/durs[scene])+')';
    timeEl.textContent=fmt(starts[scene]+elapsed)+' / '+fmt(total);
    requestAnimationFrame(tick);
  }
  function setPlaying(p){playing=p;stage.classList.toggle('paused',!p);playBtn.innerHTML=p?PAUSE:PLAY;playBtn.setAttribute('aria-label',p?'Pause':'Play')}
  playBtn.addEventListener('click',function(){setPlaying(!playing)});
  document.getElementById('replay').addEventListener('click',function(){go(0);setPlaying(true)});
  document.getElementById('fs').addEventListener('click',function(){
    try{if(document.fullscreenElement){document.exitFullscreen()}else if(frame.requestFullscreen){var r=frame.requestFullscreen();if(r&&r.catch)r.catch(function(){})}}catch(e){}
  });
  frame.addEventListener('click',function(e){if(e.target.closest('button'))return;setPlaying(!playing)});
  function fit(){
    var w=frame.clientWidth,h=frame.clientHeight,s=Math.min(w/1280,h/720);
    stage.style.transform='translate('+((w-1280*s)/2)+'px,'+((h-720*s)/2)+'px) scale('+s+')';
  }
  if(window.ResizeObserver)new ResizeObserver(fit).observe(frame);window.addEventListener('resize',fit);fit();
  // The site pauses the trailer when you leave the INFO tab (see index.html,
  // switchTab). Same origin only.
  window.addEventListener('message',function(e){if(e.origin!==location.origin)return;var d=e.data||{};if(d.vsTrailer==='pause')setPlaying(false);if(d.vsTrailer==='play')setPlaying(true)});
  setPlaying(true);go(0);requestAnimationFrame(tick);
})();
</script>
